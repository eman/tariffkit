# ACC Plus adder, PG&E Schedule NBT.
#
# This is NOT present in PG&E's export-rate data files -- every row there
# carries Sector=ALL with no customer-class differentiation -- so it is
# transcribed from the tariff and added on top.
#
# Keyed by the calendar year of the completed interconnection application, then
# held CONSTANT for nine years from the Permission-To-Operate date. The
# year-over-year decline below is a step-down for later applicants, not a decay
# applied to an existing customer.
#
# Unlike ordinary export credits, ACC Plus applies to all charges including
# non-bypassable charges, does not expire, and is cashed out on account closure.

schema = 1
unit = "USD/kWh"
source = "PG&E Schedule NBT"

[residential]
2023 = 0.02200
2024 = 0.01760
2025 = 0.01320
2026 = 0.00880
2027 = 0.00440

[residential_low_income]
2023 = 0.09000
2024 = 0.07200
2025 = 0.05400
2026 = 0.03600
2027 = 0.01800

# Non-residential customers are not eligible for ACC Plus.
