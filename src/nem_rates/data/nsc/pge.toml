# PG&E Net Surplus Compensation (NSC) rates, by true-up month.
#
# Source: PG&E, "Net Surplus Compensation Rates for Energy"
#   https://www.pge.com/assets/pge/docs/clean-energy/solar/AB920-RateTable.pdf
# Retrieved 2026-08-12; the table then ran Jan. 2025 through Aug. 2026.
#
# Definition, quoted from the table's own footnote:
#
#   Per D.11-06-016, the electricity portion of the NSC rate is the simple
#   rolling average of PG&E's default load aggregation point price from 7 a.m.
#   to 5 p.m., corresponding to the customer's 12-month true-up period.
#
# Schedule NBT, Special Condition 5.b adds the mechanics: PG&E calculates the
# rate each month, effective the first of that month, and applies it to any Net
# Surplus Generator whose Relevant Period completed in that month. The DLAP
# cutoff is the 20th of the prior month, plus five days for CAISO to finalise
# day-ahead prices.
#
# READ THIS BEFORE USING IT FOR A CCA ACCOUNT. Schedule NBT, Special Condition
# 5.a:
#
#   Net Surplus Generators who receive Direct Access (DA) Service from an ESP or
#   who receive Community Choice Aggregation (CCA) Service from a CCA are not
#   eligible to receive NSC from PG&E but may contact their ESP or CCA Provider
#   to see if they provide NSC.
#
# Applicability is limited to "all bundled Net Surplus Generators". So for a CCA
# account this table is NOT the rate that will be paid -- the CCA's own tariff
# governs, and MCE's Solar Billing Plan determines its rate at cash-out rather
# than publishing it in advance. These values are still vendored because they
# are the only published, auditable NSC series available, which makes them a
# usable stand-in until a real cash-out statement exists. Anything computed from
# them for a CCA account is an estimate and is flagged as one.

schema = 1
