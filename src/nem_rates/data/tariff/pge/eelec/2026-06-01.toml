# PG&E Schedule E-ELEC (Electric Home) -- residential time-of-use.
#
# Source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-ELEC.pdf
# Advice Letter 7921-E (CPUC D.26-04-036), effective 2026-06-01.
#
# Transcribed by hand from the tariff sheet. The unbundled components below sum
# exactly to the published totals in [totals]; tests/test_eelec.py asserts that,
# which is what catches a transcription slip.

schema = 1
utility = "PGE"
tariff = "E-ELEC"
effective = "2026-06-01"
advice_letter = "7921-E"
source_url = "https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-ELEC.pdf"
currency = "USD/kWh"

# E-ELEC is untiered: no baseline allowance and no tier structure. Baseline
# applies only to E-1 and E-TOU-C.
has_baseline = false

[seasons]
# Summer runs June 1 through September 30; winter is the remainder. A billing
# period spanning both is prorated by the number of days in each.
summer_start = "06-01"
summer_end = "09-30"

[periods]
# Applies every day, INCLUDING weekends and holidays, and the boundaries do not
# shift by season. Half-open [start, end) hours in Pacific Prevailing Time.
peak = [[16, 21]]
part_peak = [[15, 16], [21, 24]]
# Off-peak is every hour not listed above (00:00-15:00).

# Season- and period-dependent components.
[energy.summer.peak]
generation = 0.26299
distribution = 0.23199

[energy.summer.part_peak]
generation = 0.16388
distribution = 0.16922

[energy.summer.off_peak]
generation = 0.11878
distribution = 0.15764

[energy.winter.peak]
generation = 0.10086
distribution = 0.16261

[energy.winter.part_peak]
generation = 0.08089
distribution = 0.16049

[energy.winter.off_peak]
generation = 0.06754
distribution = 0.15998

# Flat riders applied to all usage in every period and season.
[adders]
transmission = 0.04638
transmission_rate_adjustments = 0.00453
reliability_services = 0.00013
public_purpose_programs = 0.00614
nuclear_decommissioning = -0.00002
competition_transition_charges = 0.00027
energy_cost_recovery = 0.00002
wildfire_fund_charge = 0.00591
new_system_generation = 0.00000
wildfire_hardening = 0.00391
recovery_bond_charge = 0.00857
recovery_bond_credit = -0.00857
bundled_pcia = -0.01011

# Riders a Community Choice Aggregation or Direct Access customer does not pay,
# because PG&E is not supplying their generation.
#
# NOT INCLUDED, because it is not published by PG&E at all: the CCA's own
# generation rate card. Set it via CcaConfig if you take CCA service; until you
# do, CCA mode reports delivery-only prices and flags them as incomplete.
[cca]
drop_components = ["generation", "bundled_pcia"]

# Vintaged PCIA a CCA/DA customer pays instead of the bundled PCIA, keyed by the
# year their generation service began. An unlisted vintage raises rather than
# silently interpolating.
#
# Complete: all 18 vintages from the "Vintage Power Charge Indifference
# Adjustment (per kWh)" table on Sheet 5 (Cal. P.U.C. Sheet 61120-E, Advice
# 7846-E, effective 2026-03-01). Sheets revise independently, so this table
# carries an earlier advice letter than the energy rates above; it is the one in
# force. Parenthesised values on the sheet are negative.
[cca.pcia_vintages]
2009 = 0.02973
2010 = 0.03366
2011 = 0.03492
2012 = 0.03676
2013 = 0.03708
2014 = 0.03686
2015 = 0.03680
2016 = 0.03687
2017 = 0.03661
2018 = 0.03679
2019 = 0.03725
2020 = 0.03632
2021 = 0.05264
2022 = 0.05272
2023 = 0.05380
2024 = 0.05066
2025 = -0.01011
2026 = -0.01011

# Schedule E-FFS franchise fee surcharge, which a CCA/DA customer pays and a
# bundled customer does not. Vintaged off the same year as the PCIA above, so it
# is keyed identically and resolves without extra configuration.
#
# Source: Schedule E-FFS, "DA/CCA Franchise Fee Surcharge Rate per kWh",
# Advice 7797-E, effective 2026-01-01. Residential row only -- E-ELEC is a
# residential schedule, and the sheet prices each customer class separately.
# The sheet also lists a Pre-2009 vintage ($0.00086); it is omitted because the
# PCIA table has no pre-2009 entry, so such a customer cannot be priced anyway.
[cca.franchise_fee_vintages]
2009 = 0.00064
2010 = 0.00061
2011 = 0.00060
2012 = 0.00059
2013 = 0.00059
2014 = 0.00059
2015 = 0.00059
2016 = 0.00059
2017 = 0.00059
2018 = 0.00059
2019 = 0.00059
2020 = 0.00059
2021 = 0.00048
2022 = 0.00048
2023 = 0.00047
2024 = 0.00049
2025 = 0.00093
2026 = 0.00093

# AB 205 income-graduated fixed charge, billed per day. This is deliberately
# NOT folded into the per-kWh price: it does not vary with consumption and
# including it would corrupt any marginal dispatch decision.
[base_services_charge]
unit = "USD/day"
tier_1 = 0.19713  # CARE-eligible, 0-200% FPG
tier_2 = 0.39688  # FERA 200-250% FPG, or deed-restricted affordable housing
tier_3 = 0.79343  # everyone else

# Percentage discounts on bundled charges.
[discounts]
care = 0.35000  # E-ELEC-specific figure; general residential CARE is 0.34964
fera = 0.18000
# The Wildfire Fund Charge is excluded from CARE and Medical Baseline sales.
care_excludes = ["wildfire_fund_charge"]

# Published totals, used to verify the component breakdown above.
[totals.summer]
peak = 0.55214
part_peak = 0.39026
off_peak = 0.33358

[totals.winter]
peak = 0.32063
part_peak = 0.29854
off_peak = 0.28468
