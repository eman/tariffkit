# PG&E Schedule E-TOU-C -- Residential Time-of-Use (Peak Pricing 4-9 p.m. Every Day).
#
# Source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-TOU-C.pdf
# Advice Letter 7921-E (CPUC D.26-04-036), effective 2026-06-01.
#
# Transcribed by hand from the tariff sheet. The unbundled components sum exactly
# to the published totals in [totals]; tests/test_schedules.py asserts that,
# which is what catches a mistyped digit.
#
# Two things make this schedule unlike E-ELEC:
#   * There is no part-peak period at all -- peak or off-peak, nothing between.
#   * A baseline credit applies to the first N kWh of a cycle. That is a
#     quantity, not a time, so it cannot be expressed as a marginal price; see
#     [baseline] below and the billing engine.

schema = 1
utility = "PGE"
tariff = "E-TOU-C"
effective = "2026-06-01"
advice_letter = "7921-E"
source_url = "https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-TOU-C.pdf"
currency = "USD/kWh"

has_baseline = true

[seasons]
summer_start = "06-01"
summer_end = "09-30"

[periods]
# "Peak: 4:00 p.m. to 9:00 p.m., All days" in both seasons. Everything else is
# off-peak; the sheet defines no part-peak, so the key is absent rather than
# empty, and the loader treats a missing period as one this schedule lacks.
peak = [[16, 21]]

[energy.summer.peak]
generation = 0.20782
distribution = 0.20388

[energy.summer.off_peak]
generation = 0.10482
distribution = 0.18388

[energy.winter.peak]
generation = 0.13710
distribution = 0.14977

[energy.winter.off_peak]
generation = 0.11042
distribution = 0.14645

# Flat riders applied to all usage in every period and season.
[adders]
# The over-baseline Conservation Incentive Adjustment. Usage within baseline is
# charged the within-baseline rate instead; see [baseline].
conservation_incentive_adjustment = 0.05354
transmission = 0.04638
transmission_rate_adjustments = 0.00453
reliability_services = 0.00013
public_purpose_programs = 0.00614
nuclear_decommissioning = -0.00002
competition_transition_charges = 0.00027
energy_cost_recovery = 0.00002
wildfire_fund_charge = 0.00591
new_system_generation = 0.00000
wildfire_hardening = 0.00391
recovery_bond_charge = 0.00857
recovery_bond_credit = -0.00857
bundled_pcia = -0.01011

# The bill prints one "Baseline Credit" line, but the sheet implements it as two
# Conservation Incentive Adjustment rates. Usage within the allowance is credited
# 0.02786; usage over it is charged 0.05354. The spread is the printed credit:
#
#   0.05354 - (-0.02786) = 0.08140
#
# [adders] carries the over-baseline rate, so a marginal price is the
# over-baseline price -- correct for dispatch, since a cycle's allowance is
# normally spent early. The billing engine swaps in the within-baseline rate for
# the allowance portion.
#
# The credit is the same in peak and off-peak, so how PG&E allocates baseline
# usage across periods changes the printed lines but not the total.
[baseline]
within_rate = -0.02786
over_rate = 0.05354
credit = 0.08140

# BASELINE (TIER 1) QUANTITIES, kWh per day, from Special Conditions 1.
# Code B is basic service; Code H is all-electric. Your bill names the territory
# ("Baseline Territory X") and the heat source.
[baseline.quantities.basic]
P = { summer = 13.5, winter = 11.0 }
Q = { summer = 9.8, winter = 11.0 }
R = { summer = 17.7, winter = 10.4 }
S = { summer = 15.0, winter = 10.2 }
T = { summer = 6.5, winter = 7.5 }
V = { summer = 7.1, winter = 8.1 }
W = { summer = 19.2, winter = 9.8 }
X = { summer = 9.8, winter = 9.7 }
Y = { summer = 10.5, winter = 11.1 }
Z = { summer = 5.9, winter = 7.8 }

[baseline.quantities.all_electric]
P = { summer = 15.2, winter = 26.0 }
Q = { summer = 8.5, winter = 26.0 }
R = { summer = 19.9, winter = 26.7 }
S = { summer = 17.8, winter = 23.7 }
T = { summer = 7.1, winter = 12.9 }
V = { summer = 10.4, winter = 19.1 }
W = { summer = 22.4, winter = 19.0 }
X = { summer = 8.5, winter = 14.6 }
Y = { summer = 12.0, winter = 24.0 }
Z = { summer = 6.7, winter = 15.7 }

# The vintaged PCIA and franchise fee tables below are PG&E-wide -- each
# residential sheet reprints them -- and are reproduced verbatim from the E-ELEC
# snapshot so they cannot drift by retyping. tests/test_schedules.py asserts the
# three schedules agree.
# Riders a Community Choice Aggregation or Direct Access customer does not pay,
# because PG&E is not supplying their generation.
#
# NOT INCLUDED, because it is not published by PG&E at all: the CCA's own
# generation rate card. Set it via CcaConfig if you take CCA service; until you
# do, CCA mode reports delivery-only prices and flags them as incomplete.
[cca]
drop_components = ["generation", "bundled_pcia"]

# Vintaged PCIA a CCA/DA customer pays instead of the bundled PCIA, keyed by the
# year their generation service began. An unlisted vintage raises rather than
# silently interpolating.
#
# Complete: all 18 vintages from the "Vintage Power Charge Indifference
# Adjustment (per kWh)" table on Sheet 5 (Cal. P.U.C. Sheet 61120-E, Advice
# 7846-E, effective 2026-03-01). Sheets revise independently, so this table
# carries an earlier advice letter than the energy rates above; it is the one in
# force. Parenthesised values on the sheet are negative.
[cca.pcia_vintages]
2009 = 0.02973
2010 = 0.03366
2011 = 0.03492
2012 = 0.03676
2013 = 0.03708
2014 = 0.03686
2015 = 0.03680
2016 = 0.03687
2017 = 0.03661
2018 = 0.03679
2019 = 0.03725
2020 = 0.03632
2021 = 0.05264
2022 = 0.05272
2023 = 0.05380
2024 = 0.05066
2025 = -0.01011
2026 = -0.01011

# Schedule E-FFS franchise fee surcharge, which a CCA/DA customer pays and a
# bundled customer does not. Vintaged off the same year as the PCIA above, so it
# is keyed identically and resolves without extra configuration.
#
# Source: Schedule E-FFS, "DA/CCA Franchise Fee Surcharge Rate per kWh",
# Advice 7797-E, effective 2026-01-01. Residential row only -- E-ELEC is a
# residential schedule, and the sheet prices each customer class separately.
# The sheet also lists a Pre-2009 vintage ($0.00086); it is omitted because the
# PCIA table has no pre-2009 entry, so such a customer cannot be priced anyway.
[cca.franchise_fee_vintages]
2009 = 0.00064
2010 = 0.00061
2011 = 0.00060
2012 = 0.00059
2013 = 0.00059
2014 = 0.00059
2015 = 0.00059
2016 = 0.00059
2017 = 0.00059
2018 = 0.00059
2019 = 0.00059
2020 = 0.00059
2021 = 0.00048
2022 = 0.00048
2023 = 0.00047
2024 = 0.00049
2025 = 0.00093
2026 = 0.00093

# AB 205 income-graduated fixed charge, billed per day. Deliberately NOT folded
# into the per-kWh price: it does not vary with consumption, and including it
# would corrupt any marginal dispatch decision.
[base_services_charge]
unit = "USD/day"
tier_1 = 0.19713  # CARE-eligible, 0-200% FPG
tier_2 = 0.39688  # FERA 200-250% FPG, or deed-restricted affordable housing
tier_3 = 0.79343  # everyone else

# No [discounts] block: neither the CARE nor the FERA percentage is published on
# this schedule's sheet. Requesting one raises rather than borrowing E-ELEC's
# figure, which is documented there as schedule-specific.

# Published totals, used to verify the component breakdown above. These are the
# over-baseline totals; within baseline each is lower by [baseline].credit.
[totals.summer]
peak = 0.52240
off_peak = 0.39940

[totals.winter]
peak = 0.39757
off_peak = 0.36757
