# Pacific Gas and Electric Schedule E-ELEC -- retail time-of-use rates.
#
# Source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-ELEC.pdf
#
# GENERATED by `python -m tools.regen tariff` -- do not hand-edit the rate tables.
# Regenerate with:
#     python -m tools.regen tariff --provider eelec
#
# A tariff book's sheets revise independently, so each carries its own
# advice letter and effective date. The snapshot is dated from the sheet
# carrying the unbundled rate table, which is when these values took
# force -- not the latest date in the book. Sheets read:
#     Sheet 2: Advice 7516-E, effective 2025-03-01
#
# The unbundled components below sum exactly to the published totals in
# [totals]; regeneration refuses to write unless they do, which is what
# makes a silent mis-parse essentially impossible.

schema = 1
utility = "pacific_gas_and_electric"
tariff = "E-ELEC"
effective = "2025-03-01"
advice_letter = "7516-E"
source_url = "https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_E-ELEC.pdf"
currency = "USD/kWh"

# Structure the sheet does not publish, carried forward from the previous
# snapshot. Changing any of it is a deliberate human edit.
has_baseline = false

[seasons]
summer_start = "06-01"
summer_end = "09-30"

[periods]
peak = [[16, 21]]
part_peak = [[15, 16], [21, 24]]

# Season- and period-dependent components.

[energy.summer.peak]
generation = 0.31659
distribution = 0.23953

[energy.summer.part_peak]
generation = 0.21748
distribution = 0.17676

[energy.summer.off_peak]
generation = 0.17238
distribution = 0.16518

[energy.winter.peak]
generation = 0.15446
distribution = 0.17014

[energy.winter.part_peak]
generation = 0.13449
distribution = 0.16802

[energy.winter.off_peak]
