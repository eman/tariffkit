# DEEP GREEN PREMIUM ONLY. MCE did not reprice residential generation between
# 2023-01-01 and 2026-04-01 -- its March 2025 board packet states "MCE last
# increased rates effective January 1, 2023" -- and every generation rate here
# is the one the 2023 card published, re-read off this card to confirm it. What
# moved is the Deep Green premium, $0.01 -> $0.0125/kWh, which the card prints
# as "Deep Green Premium All Usage* as above plus $0.0125/kWh".
#
# The effective date is the card's own label ("as of 10/1/25"); MCE publishes no
# filing that dates the change. It is bounded below by a 2025-04-18 capture
# still showing $0.01, so a Deep Green account between those dates is still
# credited the older premium. The card's header line was never updated and
# still reads "Rates effective 1.1.23", so regenerating this file from the card
# would target 2023-01-01.toml and overwrite the good 2023 vintage -- date any
# future MCE vintage by hand.
#
# Marin Clean Energy (MCE) residential generation rates.
#
# Source: https://mcecleanenergy.org/wp-content/uploads/2024/06/MCE-website-rate-table_RES_as-of-100125.pdf
# Solar Billing Plan tariff: https://mcecleanenergy.org/wp-content/uploads/2024/12/MCE-Solar-Billing-Plan-Tariff_120424.pdf
#
# GENERATED by `python -m tools.regen cca` -- do not hand-edit the rate tables.
#
# A CCA supplies generation only; delivery stays with the utility, so these
# are generation rates alone and pair with that utility's tariff sheet.
#
# These may currently equal the utility's own generation component exactly.
# That is parity today, not an alias: they are vendored separately so a
# divergence shows up rather than being silently inherited. Regeneration
# reports the parity status of every rate it writes.

schema = 1
provider = "MCE"
name = "Marin Clean Energy"
utility = "pacific_gas_and_electric"
schedules = ["E-ELEC", "E-TOU-C", "EV2-A"]
effective = "2025-10-01"
currency = "USD/kWh"
source_url = "https://mcecleanenergy.org/wp-content/uploads/2024/06/MCE-website-rate-table_RES_as-of-100125.pdf"

# Checksum of the document these values were read from. A scheduled check
# compares it so a republished card is noticed even when it cannot be
# parsed -- detection does not need a text layer, only bytes.
source_sha256 = "c71f2289a89d4d704e36dd910c5815cab65e3bdedd1d0b97b17e5a2faf4d63e8"
source_read_on = "2026-08-29"

[options]
light_green = 0.0
deep_green = 0.0125

[generation.eelec.summer]
peak = 0.301
part_peak = 0.199
off_peak = 0.152

[generation.eelec.winter]
peak = 0.134
part_peak = 0.113
off_peak = 0.099

[generation.etouc.summer]
peak = 0.195
off_peak = 0.144

[generation.etouc.winter]
peak = 0.149
off_peak = 0.135

[generation.ev2a.summer]
peak = 0.21
part_peak = 0.167
off_peak = 0.128

[generation.ev2a.winter]
peak = 0.155
part_peak = 0.144
off_peak = 0.121

[export]
# Terms from MCE's Solar Billing Plan tariff, effective 2023-12-01 -- a
# different document from the rate card above, and on its own calendar. That is
# why they appear from this vintage rather than from the 2023-01-01 card: the
# SBP tariff did not exist when that card was published.
#
# "All customers will also receive a Solar Bonus Credit which provides an
# additional 10% of the base export credit."
solar_bonus_fraction = 0.10

# "CARE and FERA customers will receive a $0.05/kWh generation export bonus
# credit on all exports until December 31, 2028."
care_fera_bonus_rate = 0.05
care_fera_bonus_through = "2028-12-31"

# Not verified for this period. The measurement behind the 2026-04-01 card was
# made against the 2026-06-30..2026-07-28 statement and speaks only for the
# rates on that card, so an export priced here is reported incomplete rather
# than claimed exact.
export_credit_basis = "acc_generation"
export_credit_verified = false

# Left at the default. MCE crediting an ACC Plus adder of its own was
# established from the 2026-08-04 statement; nothing establishes it for this
# period, and asserting it would invent credit.
credits_acc_plus = false
