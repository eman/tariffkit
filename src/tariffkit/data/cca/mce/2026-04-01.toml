# NOTES -- hand-written, and kept verbatim above the generated header when
# `python -m tools.regen cca` rewrites this file. Everything below the header is
# generated; comments placed inside its tables are not kept.
#
# THE NOVEMBER 2026 REISSUE. On 2026-11-03 MCE replaced this card with
# "..._as-of-4.1.26_updated-Nov-1-credit.pdf" and withdrew the original (its URL
# now 404s). Every generation rate and the Deep Green premium are unchanged; the
# cost relief credit is not. The original card printed -0.0062/kWh "through
# December 31, 2026"; the reissue prints -0.03725/kWh "from November 1, 2026
# through March 31, 2027" and lists no other credit. The earlier credit is
# therefore recorded as ending 2026-10-31, replaced rather than stacked -- an
# inference from the card listing only one, which the first statement with a
# November day on it should confirm.
#
# HOW THESE WERE READ. The original card had no text layer, so its values were
# read from the rendered page on 2026-08-12. The reissue has text again, and
# extracts to exactly the same 16 generation rates.
#
# VERIFICATION. Three rates are confirmed against the July 2026 statement as
# well as the card -- summer E-ELEC peak 0.26299, part-peak 0.16388, off-peak
# 0.11878 -- as is the -0.0062 credit (tests/test_mce.py). The remaining
# thirteen rest on the card alone until a bill exercises them. There is no
# arithmetic check, unlike a PG&E snapshot: nothing published for these to sum
# to.
#
# PARITY. Every generation rate equals PG&E's bundled generation component for
# the same schedule, season and period. That is an observation, not an alias;
# tests/test_mce.py asserts it so a divergence fails loudly. The rates are keyed
# by schedule because they differ substantially between schedules -- winter
# off-peak is 0.06754 on E-ELEC and 0.11042 on E-TOU-C -- so an uncovered
# schedule raises rather than borrowing another's. MCE's "ELEC" pairs with
# PG&E's E-ELEC and bills as "SBP EELEC" on the Solar Billing Plan.
#
# EXPORT. Carried forward, not read from the card. The solar bonus (10% of the
# base export credit) and the CARE/FERA bonus ($0.05/kWh through 2028) are from
# MCE's Solar Billing Plan tariff, section 1. `export_credit_basis` was
# measured: 2,784 quarter-hourly intervals for the 2026-06-30..07-28 cycle,
# priced and compared with that statement, land within 0.3% on every export
# component (MCE generation EEC -0.1%, PG&E delivery EEC -0.2%, ACC Plus -0.3%,
# solar bonus +0.2%). `credits_acc_plus`: the 2026-08-04 statement prints PG&E
# applying -$1.71 of Energy Export Bonus Credits on its page while MCE's page
# separately reports $1.70 of EEBC earned and a $3.29 balance -- a second adder
# of MCE's own, settled on MCE's Solar Billing Plan year, not PG&E's shown twice.
#
# Marin Clean Energy (MCE) residential generation rates.
#
# Source: https://mcecleanenergy.org/wp-content/uploads/2026/09/MCE-website-rate-table_RES_as-of-4.1.26_updated-Nov-1-credit.pdf
# Solar Billing Plan tariff: https://mcecleanenergy.org/wp-content/uploads/2024/12/MCE-Solar-Billing-Plan-Tariff_120424.pdf
#
# GENERATED by `python -m tools.regen cca` -- do not hand-edit the rate tables.
#
# A CCA supplies generation only; delivery stays with the utility, so these
# are generation rates alone and pair with that utility's tariff sheet.
#
# These may currently equal the utility's own generation component exactly.
# That is parity today, not an alias: they are vendored separately so a
# divergence shows up rather than being silently inherited. Regeneration
# reports the parity status of every rate it writes.

schema = 1
provider = "MCE"
name = "Marin Clean Energy"
utility = "pacific_gas_and_electric"
schedules = ["E-ELEC", "E-TOU-C", "EV2-A"]
effective = "2026-04-01"
currency = "USD/kWh"
source_url = "https://mcecleanenergy.org/wp-content/uploads/2026/09/MCE-website-rate-table_RES_as-of-4.1.26_updated-Nov-1-credit.pdf"

# Checksum of the document these values were read from. A scheduled check
# compares it so a republished card is noticed even when it cannot be
# parsed -- detection does not need a text layer, only bytes.
source_sha256 = "c936fbe13c2d67cdebecdbbbe8736792c9dd254294f65164805b6d170b40ec3e"
source_read_on = "2026-11-09"

[options]
light_green = 0.0
