get_rates:
  name: Get rates
  description: Return a bounded, timestamped TariffKit rate forecast.
  target: {}
  fields:
    config_entry:
      name: TariffKit config entry
      description: The loaded TariffKit entry to price with.
      required: true
      selector:
        config_entry:
          integration: tariffkit
    start:
      name: Start
      description: An offset-aware timestamp aligned to the requested resolution.
      selector:
        text:
    end:
      name: End
      description: An offset-aware timestamp aligned to the requested resolution.
      selector:
        text:
    date:
      name: Date
      description: Pacific calendar date to start a forecast at midnight.
      selector:
        date:
    horizon:
      name: Horizon (hours)
      description: Forecast horizon when an end timestamp is not supplied.
      default: 24
      selector:
        number:
          min: 1
          max: 168
          mode: box
    resolution:
      name: Resolution
      description: Slot size in minutes.
      default: 60
      selector:
        select:
          options:
            - "15"
            - "30"
            - "60"

