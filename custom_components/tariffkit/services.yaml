backfill_usage:
  name: Backfill metered usage
  description: >-
    Price metered history into long-term statistics, so cost and credit for days
    before the meters were configured appear in Home Assistant. Writes external
    statistics under tariffkit:<profile>_*, one row per finished day. Rerunning
    replaces the window rather than adding to it, so run it again after changing
    account history.
  fields:
    config_entry:
      name: TariffKit config entry
      description: The loaded TariffKit entry to price with.
      required: true
      selector:
        config_entry:
          integration: tariffkit
    start:
      name: Start date
      description: >-
        First day to price. Defaults to the billing cycle containing the
        Permission To Operate date, which is where the export credit bank opens
        at zero and so the only start that needs no earlier history. Snapped
        back to the start of whichever billing cycle contains it, since a cycle
        can only be decomposed from its own beginning. A later start opens the
        bank at zero regardless, which overstates every amount due in the
        window; the response says so when that happens.
      selector:
        date:
