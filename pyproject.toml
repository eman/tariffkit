[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nem-rates"
version = "0.1.0"
description = "Real-time and forecast import/export electricity prices for PG&E E-ELEC under NEM 3.0 (Net Billing Tariff)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["pge", "nem3", "net-billing-tariff", "solar", "battery", "home-assistant", "energy", "tariff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
cli = []
mqtt = ["paho-mqtt>=2.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
fetch = ["httpx>=0.27"]
# Home Assistant statistics are only exposed over the WebSocket API.
ha = ["websockets>=12"]
# InfluxDB 3 is queried over its HTTP SQL API.
influx = ["httpx>=0.27"]
# Rebuilding the vendored rate data reads the publishers' PDFs. Not needed to
# price anything: the library itself never opens a PDF.
regen = ["pypdf>=4.0"]
all = ["nem-rates[cli,mqtt,web,fetch,ha,influx,regen]"]
dev = [
    "nem-rates[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
nem-rates = "nem_rates.cli:main"

[project.urls]
Homepage = "https://github.com/emansl/nem-rates"
Issues = "https://github.com/emansl/nem-rates/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nem_rates"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
# `src` above does not reach `audit/`, so without this ruff sorts it as a
# third-party package and demands an import order no one would write by hand.
known-first-party = ["nem_rates", "audit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Query(...) in a parameter default is FastAPI's documented idiom, not a bug.
"src/nem_rates/web/app.py" = ["B008"]
# Home Assistant integrations follow upstream HA conventions, not this project's.
"custom_components/*" = ["A002", "N805"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# `audit/` is checked as strictly as the package. It is not shipped, but it is a
# real program written against a strict-typed library, and its whole purpose is
# to be trusted when it reports a discrepancy. (`custom_components/` is excluded
# instead because it follows Home Assistant's conventions, not this project's.)
files = ["src/nem_rates", "audit"]

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
# paho re-exports CallbackAPIVersion from a submodule without listing it in
# __all__, which strict mode reads as a private attribute.
no_implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slowdata: requires the full upstream PG&E dataset"]
