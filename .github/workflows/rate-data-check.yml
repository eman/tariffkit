name: Upstream rate data check

# PG&E updates export rates by October 1 of any year the CPUC adopts a new
# Avoided Cost Calculator, and changes retail rates more often via advice
# letters. This turns that drift into a failing build instead of silently stale
# numbers.

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Compare vendored export rates against PG&E
        run: uv run python tools/regen_data.py --download --check
      - name: Open an issue when upstream has moved
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Vendored rate data is out of date with PG&E';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rate-data',
            });
            if (existing.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['rate-data'],
              body: [
                'The scheduled check found upstream export rates differing from the vendored data.',
                '',
                'To refresh:',
                '```bash',
                'python tools/regen_data.py --download',
                'uv run pytest',
                '```',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
