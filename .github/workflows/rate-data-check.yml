name: Upstream rate data check

# PG&E updates export rates by October 1 of any year the CPUC adopts a new
# Avoided Cost Calculator, and changes retail rates more often via advice
# letters. This turns that drift into a failing build instead of silently stale
# numbers.

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-data-check
  cancel-in-progress: false

jobs:
  compare:
    name: Compare vendored data
    runs-on: ubuntu-latest
    outputs:
      export_outcome: ${{ steps.export.outcome }}
      retail_outcome: ${{ steps.retail.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --group regen
      - name: Compare vendored export rates against the utility
        id: export
        run: uv run python -m tools.regen.export --download --check
      # Runs even when the export check failed, so one report covers both
      # rather than the first failure hiding the second. Sources a script
      # cannot fetch are skipped with a note, not failed: they are unknown
      # rather than stale, and a permanently red job trains everyone to ignore
      # it.
      - name: Compare vendored tariffs, adders and CCA cards against publishers
        id: retail
        if: always()
        run: uv run python -m tools.regen --check
      # Gated on the two comparisons, not on `failure()`. Any job failure --
      # a flaky download of a 35 MB archive, a uv hiccup, a full runner --
      # would otherwise file "rate data is out of date" when nothing is stale;
      # and because the dedupe below returns early while an open rate-data
      # issue exists, one such false alarm left open silences every real one
      # after it.
  report:
    name: Report upstream changes
    needs: compare
    if: >-
      always() && (needs.compare.outputs.export_outcome == 'failure'
      || needs.compare.outputs.retail_outcome == 'failure')
    runs-on: ubuntu-latest
    # Scheduled tokens cannot create issues without this job-scoped grant.
    # Keeping it off the comparison job prevents downloaded publisher data or
    # regeneration tooling from receiving repository write access.
    permissions:
      issues: write # Creates the deduplicated stale-rate-data issue.
    steps:
      - name: Open an issue when upstream has moved
        env:
          EXPORT_OUTCOME: ${{ needs.compare.outputs.export_outcome }}
          RETAIL_OUTCOME: ${{ needs.compare.outputs.retail_outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Vendored rate data is out of date with PG&E';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rate-data',
            });
            if (existing.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['rate-data'],
              body: [
                'The scheduled check found upstream rate data differing from what is vendored.',
                '',
                `- export rates (\`tools.regen.export\`): **${process.env.EXPORT_OUTCOME}**`,
                `- retail tariffs (\`tools.regen\`): **${process.env.RETAIL_OUTCOME}**`,
                '',
                'To refresh whichever failed:',
                '```bash',
                'python -m tools.regen.export --download   # export rate matrices',
                'python -m tools.regen                    # tariffs, adders, CCA cards',
                'uv run pytest',
                '```',
                '',
                'Both refuse to write unless the new data reconciles against its own',
                'published totals, so a failure here is a signal to look, not to trust.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
