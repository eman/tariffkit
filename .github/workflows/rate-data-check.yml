name: Upstream rate data check

# PG&E updates export rates by October 1 of any year the CPUC adopts a new
# Avoided Cost Calculator, and changes retail rates more often via advice
# letters. This turns that drift into a failing build instead of silently stale
# numbers.

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Compare vendored export rates against the utility
        id: export
        run: uv run python -m nem_rates.regen.export --download --check
      # Runs even when the export check failed, so one report covers both
      # rather than the first failure hiding the second. Sources a script
      # cannot fetch are skipped with a note, not failed: they are unknown
      # rather than stale, and a permanently red job trains everyone to ignore
      # it.
      - name: Compare vendored tariffs, adders and CCA cards against publishers
        id: retail
        if: always()
        run: uv run nem-rates regen --check
      - name: Open an issue when upstream has moved
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Vendored rate data is out of date with PG&E';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rate-data',
            });
            if (existing.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['rate-data'],
              body: [
                'The scheduled check found upstream rate data differing from what is vendored.',
                '',
                `- export rates (\`regen_data.py\`): **${{ steps.export.outcome }}**`,
                `- retail tariffs (\`regen_tariff.py\`): **${{ steps.retail.outcome }}**`,
                '',
                'To refresh whichever failed:',
                '```bash',
                'python -m nem_rates.regen.export --download   # export rate matrices',
                'nem-rates regen                                # tariffs, adders, CCA cards',
                'uv run pytest',
                '```',
                '',
                'Both refuse to write unless the new data reconciles against its own',
                'published totals, so a failure here is a signal to look, not to trust.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
