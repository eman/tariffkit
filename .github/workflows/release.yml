name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse, defaulting to the committed project version
        required: false
        type: string
      stage-testpypi:
        description: Stage the rehearsed artifacts on TestPyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tariffkit-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build once
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a rehearsal to run from the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Rehearsals must run from main, not $GITHUB_REF" >&2
          exit 1
      - name: Require the tagged commit to be on the default branch
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit merged to main" >&2
            exit 1
          fi
      - name: Resolve the release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing TariffKit $version"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.14.2
      - run: uv sync --locked --all-extras --group dev --python 3.14.2
      - name: Verify release identity
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run python -m tools.release check \
            --version "$RELEASE_VERSION" \
            --tag "v$RELEASE_VERSION"
      - name: Require an unused production version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: uv run python -m tools.release available "$RELEASE_VERSION" --repository pypi
      - name: Require an unused TestPyPI version
        if: github.event_name == 'workflow_dispatch' && inputs.stage-testpypi
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: uv run python -m tools.release available "$RELEASE_VERSION" --repository testpypi
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=tariffkit --cov-report=term-missing
      - run: uv run pytest audit/tests
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - name: Build and verify the HACS integration archive
        run: uv run python -m tools.release build-hacs
      - name: Verify artifact boundaries
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/data/export/pge/nbt26.json.gz'
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/data/holidays.toml'
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/py.typed'
          if python -m zipfile -l dist/*.whl | grep -qE '^(audit|tools)/|/\.cache/'; then
            echo "Repository-only files found in wheel" >&2
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -qE '/(audit|tools)/|/\.cache/'; then
            echo "Repository-only files found in sdist" >&2
            exit 1
          fi
      - name: Verify the HACS archive layout
        run: |
          if unzip -Z1 hacs/tariffkit.zip | grep -q '^custom_components/'; then
            echo "HACS archive must hold the integration at ZIP root" >&2
            exit 1
          fi
          unzip -Z1 hacs/tariffkit.zip | grep -qx 'manifest.json'
          unzip -Z1 hacs/tariffkit.zip | grep -qx '__init__.py'
      - name: Install and exercise the wheel with every extra
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --no-project --with "${wheel}[all]" python -c \
            "import importlib.metadata, tariffkit; assert tariffkit.RateEngine().price_now(); assert importlib.metadata.version('tariffkit') == '$RELEASE_VERSION'"
          uv run --no-project --with "${wheel}[all]" tariffkit --version
          uv run --no-project --with "${wheel}[all]" python -c \
            "from tariffkit.web import create_app; assert create_app()"
      - name: Rebuild the wheel from the sdist
        run: |
          mkdir dist-from-sdist
          uv build dist/*.tar.gz --wheel --out-dir dist-from-sdist
          cmp dist/*.whl dist-from-sdist/*.whl
      - name: Generate checksums and release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          (
            cd dist
            sha256sum -- *.whl *.tar.gz
            cd ../hacs
            sha256sum -- tariffkit.zip
          ) > SHA256SUMS
          uv run python -m tools.release notes "$RELEASE_VERSION" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tariffkit-${{ steps.release.outputs.version }}
          path: |
            dist/
            hacs/
            SHA256SUMS
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  stage-testpypi:
    name: Stage exact build on TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.stage-testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tariffkit
    permissions:
      id-token: write # Authenticates TestPyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ needs.build.outputs.version }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    name: Publish exact build to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tariffkit
    permissions:
      id-token: write # Authenticates PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ needs.build.outputs.version }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-github:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publishes the release for the pushed tag.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ needs.build.outputs.version }}
      - name: Publish the release with tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TariffKit $RELEASE_VERSION" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz hacs/tariffkit.zip SHA256SUMS
