name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact PEP 440 release version already committed on main
        required: true
        type: string
      mode:
        description: Validate only, or stage and publish the release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release
      stage-testpypi:
        description: Stage the exact artifacts on TestPyPI before production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tariffkit-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build once
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main, not $GITHUB_REF" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.14.2
      - run: uv sync --locked --all-extras --group dev --python 3.14.2
      - name: Verify release identity
        env:
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run python -m tools.release check \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG"
      - name: Require an unused production version and tag
        if: inputs.mode == 'release'
        env:
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run python -m tools.release available "$RELEASE_VERSION" --repository pypi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists" >&2
            exit 1
          fi
      - name: Require an unused TestPyPI version
        if: inputs.mode == 'release' && inputs.stage-testpypi
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run python -m tools.release available "$RELEASE_VERSION" --repository testpypi
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=tariffkit --cov-report=term-missing
      - run: uv run pytest audit/tests
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - name: Build and verify the HACS integration archive
        run: uv run python -m tools.release build-hacs
      - name: Verify artifact boundaries
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/data/export/pge/nbt26.json.gz'
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/data/holidays.toml'
          python -m zipfile -l dist/*.whl | grep -q 'tariffkit/py.typed'
          if python -m zipfile -l dist/*.whl | grep -qE '^(audit|tools)/|/\.cache/'; then
            echo "Repository-only files found in wheel" >&2
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -qE '/(audit|tools)/|/\.cache/'; then
            echo "Repository-only files found in sdist" >&2
            exit 1
          fi
      - name: Install and exercise the wheel with every extra
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --no-project --with "${wheel}[all]" python -c \
            "import importlib.metadata, tariffkit; assert tariffkit.RateEngine().price_now(); assert importlib.metadata.version('tariffkit') == '$RELEASE_VERSION'"
          uv run --no-project --with "${wheel}[all]" tariffkit --version
          uv run --no-project --with "${wheel}[all]" python -c \
            "from tariffkit.web import create_app; assert create_app()"
      - name: Rebuild the wheel from the sdist
        run: |
          mkdir dist-from-sdist
          uv build dist/*.tar.gz --wheel --out-dir dist-from-sdist
          cmp dist/*.whl dist-from-sdist/*.whl
      - name: Generate checksums and release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          (
            cd dist
            sha256sum -- *.whl *.tar.gz
            cd ../hacs
            sha256sum -- tariffkit.zip
          ) > SHA256SUMS
          uv run python -m tools.release notes "$RELEASE_VERSION" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tariffkit-${{ inputs.version }}
          path: |
            dist/
            hacs/
            SHA256SUMS
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-testpypi:
    name: Publish exact build to TestPyPI
    if: inputs.mode == 'release' && inputs.stage-testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tariffkit
    permissions:
      id-token: write # Authenticates TestPyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ inputs.version }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  draft-release:
    name: Prepare GitHub draft
    if: >-
      always() &&
      inputs.mode == 'release' &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' ||
       needs.publish-testpypi.result == 'skipped')
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the release tag and draft with tested assets.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ inputs.version }}
      - name: Create tag and draft with tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "TariffKit $RELEASE_VERSION" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz hacs/tariffkit.zip SHA256SUMS

  publish-pypi:
    name: Approve and publish exact build to PyPI
    if: >-
      always() &&
      inputs.mode == 'release' &&
      needs.build.result == 'success' &&
      needs.draft-release.result == 'success'
    needs: [build, draft-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tariffkit
    permissions:
      id-token: write # Authenticates PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tariffkit-${{ inputs.version }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-github:
    name: Publish immutable GitHub release
    if: >-
      always() &&
      inputs.mode == 'release' &&
      needs.publish-pypi.result == 'success'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publishes the prepared immutable GitHub release.
    steps:
      - name: Publish the prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
