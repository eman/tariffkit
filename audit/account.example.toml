# The account's own history. Copy to audit/account.toml, which is gitignored.
#
# Rate DATA is already effective-dated: the library picks the tariff snapshot in
# force on the day being priced. This file dates the other half -- the ACCOUNT.
# Schedule, supplier, baseline territory and PCIA vintage all change over an
# account's life, and pricing a January cycle with April's configuration is off
# by tens of dollars in a way that looks entirely plausible.
#
# A cycle that spans two epochs is refused rather than guessed. No single
# configuration priced it, so that one statement has to be checked by hand.

[base]
utility = "PGE"
interconnection_year = 2026
pto_date = "2026-06-03"
acc_plus_segment = "residential"
baseline_territory = "X"
baseline_code = "basic"

# Each [[epoch]] applies from its `from` date until the next one begins, and
# overrides part of [base]. Add one whenever the account changed.

[[epoch]]
from = "2025-01-01"
note = "E-TOU-C with MCE supplying generation"
tariff = "E-TOU-C"
supplier = "cca"

  [epoch.cca]
  name = "MCE"
  rate_card = "mce"
  option = "light_green"
  # The statement prints this: "2011 Vintaged Power Charge Indifference
  # Adjustment". check_against_statement compares the two and complains when
  # they differ, which is how a stale copy of this file gets caught before it
  # can produce a confident, fabricated finding.
  pcia_vintage = 2011

[[epoch]]
from = "2026-03-01"
note = "moved to EV2-A after the vehicle charger went in"
tariff = "EV2-A"
supplier = "cca"

  [epoch.cca]
  name = "MCE"
  rate_card = "mce"
  option = "light_green"
  pcia_vintage = 2011
