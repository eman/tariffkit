<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">TariffKit</title>
  <desc id="desc">TariffKit banner with the project icon and a stylized electricity rate curve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b303d"/>
      <stop offset="100%" stop-color="#176b87"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4c95d" stop-opacity="0"/>
      <stop offset="42%" stop-color="#f4c95d" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#f4c95d" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#background)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2">
    <path d="M0 80h1600M0 160h1600M0 240h1600M0 320h1600"/>
    <path d="M400 0v400M640 0v400M880 0v400M1120 0v400M1360 0v400"/>
  </g>
  <path d="M900 330h160v-30h140v20h130v-80h135v-70h135v230H900z" fill="url(#curve)"/>
  <path d="M900 330h160v-30h140v20h130v-80h135v-70h135" fill="none" stroke="#f4c95d" stroke-opacity=".65" stroke-width="5" stroke-linejoin="round"/>

  <g transform="translate(80 72)">
    <rect width="256" height="256" rx="48" fill="#176b87" stroke="#ffffff" stroke-opacity=".18" stroke-width="4"/>
    <path d="M48 58h160v32h-64v108h-32V90H48z" fill="#ffffff"/>
    <path d="M144 116h32l32 82h-34l-14-40-14 40h-34z" fill="#f4c95d"/>
  </g>

  <text x="420" y="185" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">
    TariffKit
  </text>
  <text x="424" y="252" fill="#d9edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="500">
    Electricity pricing, billing &amp; energy integrations
  </text>
</svg>
